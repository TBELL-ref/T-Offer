<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Offer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="header-start">
        <a class="brand" href="./">T-Offer</a>
        <nav class="workspace-nav" aria-label="보기">
          <button type="button" data-view="companies" class="active">회사</button>
          <button type="button" data-view="posts">공고</button>
        </nav>
        <nav class="tabs" id="stageTabs" aria-label="단계">
          <button type="button" data-tab="new" class="active">신규 <span data-count="new">0</span></button>
          <button type="button" data-tab="recommended">추천 <span data-count="recommended">0</span></button>
          <button type="button" data-tab="mail_ready">메일대기 <span data-count="mail_ready">0</span></button>
          <button type="button" data-tab="progress">진행 <span data-count="progress">0</span></button>
          <button type="button" data-tab="all">전체 <span data-count="all">0</span></button>
          <button type="button" data-tab="excluded">제외 <span data-count="excluded">0</span></button>
        </nav>
      </div>
      <div class="header-end">
        <div id="metaLine" class="meta">—</div>
        <button type="button" id="reload" class="btn-ghost">새로고침</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input id="search" type="search" placeholder="회사 · 공고 · 소스 검색" />
      </div>
      <div id="status" class="status">…</div>
    </div>

    <div class="table-wrap">
      <table class="leads-table" id="companyTable" aria-label="Offer 회사">
        <thead>
          <tr>
            <th class="col-grade">등급</th>
            <th class="col-co">회사</th>
            <th class="col-post">최근 공고</th>
            <th class="col-src">소스</th>
            <th class="col-stage">단계</th>
            <th class="col-mail">메일</th>
            <th class="col-score">점수</th>
          </tr>
        </thead>
        <tbody id="leadBody"></tbody>
      </table>
      <table class="leads-table hidden" id="postsTable" aria-label="Offer 공고">
        <thead>
          <tr>
            <th class="col-co">회사</th>
            <th class="col-post">공고 제목</th>
            <th class="col-src">소스</th>
            <th class="col-stage">수집</th>
          </tr>
        </thead>
        <tbody id="postsBody"></tbody>
      </table>
      <div id="empty" class="empty hidden"></div>
    </div>
  </div>

  <script src="./supabase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
