<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Offer — QA 알바 구인 리드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <h1 class="brand">T-Offer</h1>
        <p class="tagline">QA 알바 구인 회사 → 알바 관리 대행 프로모션 리드</p>
        <div id="metaLine">—</div>
      </div>
      <div>
        <div id="status">…</div>
        <div id="countLine"></div>
      </div>
    </header>

    <div class="toolbar">
      <div class="tabs">
        <button type="button" data-tab="new" class="active">신규</button>
        <button type="button" data-tab="recommended">추천</button>
        <button type="button" data-tab="mail_ready">메일 대기</button>
        <button type="button" data-tab="progress">진행</button>
        <button type="button" data-tab="all">전체</button>
        <button type="button" data-tab="excluded">제외</button>
      </div>
      <input id="search" type="search" placeholder="회사·공고 검색" />
      <button type="button" id="reload">새로고침</button>
    </div>

    <div id="leadList"></div>
  </div>

  <script src="./supabase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
