<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Offer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="header-start">
        <a class="brand" href="./">T-Offer</a>
        <nav class="workspace-nav" aria-label="보기">
          <button type="button" data-view="companies" class="active">회사</button>
          <button type="button" data-view="posts">공고</button>
        </nav>
        <nav class="tabs" id="empTabs" aria-label="고용형태">
          <button type="button" data-emp-filter="alba" class="active" title="알바몬·알바천국·알바 분류만">알바 <span data-emp-count="alba">0</span></button>
          <button type="button" data-emp-filter="all" title="T-Client와 동일한 전체 회사">전체 <span data-emp-count="all">0</span></button>
        </nav>
        <nav class="tabs" id="stageTabs" aria-label="단계">
          <button type="button" data-tab="new" class="active">신규 <span data-count="new">0</span></button>
          <button type="button" data-tab="recommended">추천 <span data-count="recommended">0</span></button>
          <button type="button" data-tab="progress">진행 <span data-count="progress">0</span></button>
          <button type="button" data-tab="all">전체 <span data-count="all">0</span></button>
          <button type="button" data-tab="excluded">제외 <span data-count="excluded">0</span></button>
        </nav>
        <nav class="tabs hidden" id="postTabs" aria-label="공고상태">
          <button type="button" data-post-filter="open" class="active">모집중 <span data-post-count="open">0</span></button>
          <button type="button" data-post-filter="closed">마감 <span data-post-count="closed">0</span></button>
          <button type="button" data-post-filter="all">상태전체 <span data-post-count="all">0</span></button>
        </nav>
      </div>
      <div class="header-end">
        <div id="metaLine" class="meta">—</div>
        <div class="admin-bar">
          <span id="adminBadge" class="admin-badge is-guest">비로그인</span>
          <div class="admin-anchor">
            <button type="button" id="adminUnlockBtn" class="btn-ghost btn-admin" aria-expanded="false" aria-controls="adminPopover">
              관리
            </button>
            <div id="adminPopover" class="admin-popover hidden" aria-hidden="true">
              <div id="adminLoginForm" class="admin-popover-section">
                <p class="admin-popover-title">로그인</p>
                <p class="admin-popover-hint">T-Client와 동일한 허용 이메일·비밀번호로 로그인합니다</p>
                <input type="email" id="adminEmail" class="admin-popover-input" placeholder="you@company.com" autocomplete="email" />
                <input type="password" id="adminPassword" class="admin-popover-input" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" />
                <button type="button" id="adminLoginBtn" class="btn-primary btn-sm">로그인</button>
                <button type="button" id="adminSetupEmailBtn" class="admin-text-btn">처음이에요? · 비밀번호 분실 — 설정 메일 받기</button>
              </div>
              <div id="adminPasswordSetupForm" class="admin-popover-section hidden">
                <p class="admin-popover-title">새 비밀번호 설정</p>
                <p class="admin-popover-hint">메일 링크로 들어오셨습니다. 비밀번호를 설정하세요.</p>
                <input type="password" id="adminNewPassword" class="admin-popover-input" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" />
                <input type="password" id="adminConfirmPassword" class="admin-popover-input" placeholder="비밀번호 확인" autocomplete="new-password" />
                <button type="button" id="adminPasswordSaveBtn" class="btn-primary btn-sm">비밀번호 저장</button>
              </div>
              <div id="adminTools" class="admin-popover-section hidden">
                <p class="admin-popover-title" id="adminToolsEmail"></p>
                <div class="admin-mail-block">
                  <p class="admin-popover-title">메일 본문 (공용 1개)</p>
                  <p class="admin-popover-hint">자리표시자: {{company}} {{title}} {{url}} {{titleLine}} {{urlLine}}</p>
                  <label class="admin-field-label" for="mailTplSubject">제목</label>
                  <input type="text" id="mailTplSubject" class="admin-popover-input" />
                  <label class="admin-field-label" for="mailTplBody">본문</label>
                  <textarea id="mailTplBody" class="admin-popover-textarea" rows="10"></textarea>
                  <div class="admin-mail-actions">
                    <button type="button" id="mailTplSaveBtn" class="btn-primary btn-sm">본문 저장</button>
                    <button type="button" id="mailTplResetBtn" class="admin-text-btn">기본 문구로 되돌리기</button>
                  </div>
                </div>
                <button type="button" id="adminLogout" class="admin-menu-item admin-menu-item-muted">로그아웃</button>
              </div>
              <p id="adminStatus" class="admin-popover-status hidden" aria-hidden="true"></p>
            </div>
          </div>
        </div>
        <button type="button" id="reload" class="btn-ghost">새로고침</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input id="search" type="search" placeholder="회사 · 공고 · 소스 검색" />
      </div>
      <div id="status" class="status">…</div>
    </div>

    <div class="table-wrap">
      <table class="leads-table" id="companyTable" aria-label="Offer 회사">
        <thead>
          <tr>
            <th class="col-grade">등급</th>
            <th class="col-co">회사</th>
            <th class="col-post">최근 공고</th>
            <th class="col-src">소스</th>
            <th class="col-stage">단계</th>
            <th class="col-mail">메일</th>
            <th class="col-score">점수</th>
            <th class="col-actions">작업</th>
          </tr>
        </thead>
        <tbody id="leadBody"></tbody>
      </table>
      <table class="leads-table hidden" id="postsTable" aria-label="Offer 공고">
        <thead>
          <tr>
            <th class="col-co">회사</th>
            <th class="col-post">공고 제목</th>
            <th class="col-src">소스</th>
            <th class="col-post-status">상태</th>
            <th class="col-stage">수집</th>
          </tr>
        </thead>
        <tbody id="postsBody"></tbody>
      </table>
      <div id="empty" class="empty hidden"></div>
    </div>
  </div>

  <div id="detailDrawer" class="detail-drawer hidden" aria-hidden="true">
    <div class="detail-drawer-backdrop" data-close-detail="1"></div>
    <aside class="detail-drawer-panel" role="complementary" aria-labelledby="detailTitle">
      <header class="detail-drawer-header">
        <div class="drawer-header-top">
          <div class="detail-header-main">
            <h2 id="detailTitle" class="detail-header-title">—</h2>
            <div id="detailHeaderChips" class="detail-header-chips"></div>
            <p id="detailHeaderSub" class="detail-header-sub"></p>
          </div>
          <div class="drawer-header-actions">
            <button type="button" id="detailRecommendBtn" class="drawer-action-btn" title="추천">추천</button>
            <button type="button" id="detailExcludeBtn" class="drawer-action-btn danger" title="제외">제외</button>
            <button type="button" id="detailRestoreBtn" class="drawer-action-btn hidden" title="복구">복구</button>
            <button type="button" class="drawer-close-btn" data-close-detail="1" aria-label="닫기">×</button>
          </div>
        </div>
      </header>
      <div id="detailBody" class="detail-drawer-body"></div>
    </aside>
  </div>

  <script src="./supabase-config.js"></script>
  <script src="./auth.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
